# Runs drills/k6/smoke.js inside the cluster (the script is mounted from a ConfigMap built by `make load`).
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-smoke
  namespace: sandbox
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { pool: batch }
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/smoke.js"]
          env:
            - { name: DURATION, value: "5m" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
